[package]
name = "pot-vr-launcher"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Unofficial VR launcher for Path of Titans (injects UEVR)"

[dependencies]
directories = "5"
eframe = "0.37.0"
egui_commonmark = "0.26.0"
egui_extras = { version = "0.37", features = ["all_loaders"] }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Diagnostics_Debug", "Win32_System_LibraryLoader", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Storage_FileSystem", "Win32_System_Memory"] }
